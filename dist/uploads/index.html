<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elspeth Belden — Experience Designer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Archivo:wdth,wght@125,400;125,500;125,600;125,700;125,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>
// ─────────── TWEAKS ───────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "warmth",
  "typePair": "editorial",
  "heroLayout": "stacked",
  "gridDensity": "comfortable"
}/*EDITMODE-END*/;

const ACCENTS = {
  warmth:    { name: "Warmth",    value: "#FF3414",                label: "#FF3414" },
  rust:      { name: "Rust",      value: "oklch(0.55 0.17 35)",  label: "#B65530" },
  marigold:  { name: "Marigold",  value: "oklch(0.78 0.14 75)",  label: "#E4B445" },
  ink:       { name: "Ink",       value: "oklch(0.32 0.08 260)", label: "#3B3F5C" },
  sage:      { name: "Sage",      value: "oklch(0.62 0.07 140)", label: "#7A9479" }
};

const TYPE_PAIRS = {
  editorial:  { display: "'Instrument Serif', Georgia, serif", mono: "'JetBrains Mono', ui-monospace, monospace", body: "'Inter', system-ui, sans-serif", italicDisplay: "'Instrument Serif', Georgia, serif" },
  technical:  { display: "'JetBrains Mono', ui-monospace, monospace", mono: "'JetBrains Mono', ui-monospace, monospace", body: "'Inter', system-ui, sans-serif", italicDisplay: "'Instrument Serif', Georgia, serif" },
  classic:    { display: "'Newsreader', Georgia, serif",      mono: "'JetBrains Mono', ui-monospace, monospace", body: "'Newsreader', Georgia, serif",   italicDisplay: "'Instrument Serif', Georgia, serif" },
  expanded:   { display: "'Archivo', system-ui, sans-serif",  mono: "'JetBrains Mono', ui-monospace, monospace", body: "'Inter', system-ui, sans-serif", italicDisplay: "'Instrument Serif', Georgia, serif" }
};

window.__tweaks = { ...TWEAK_DEFAULTS };
window.__ACCENTS = ACCENTS;
window.__TYPE_PAIRS = TYPE_PAIRS;

function applyTweaks(t) {
  const root = document.documentElement;
  const accent = ACCENTS[t.accent] || ACCENTS.warmth;
  const type = TYPE_PAIRS[t.typePair] || TYPE_PAIRS.editorial;
  root.style.setProperty('--accent', accent.value);
  root.style.setProperty('--font-display', type.display);
  root.style.setProperty('--font-mono', type.mono);
  root.style.setProperty('--font-body', type.body);
  root.style.setProperty('--font-italic', type.italicDisplay);
  root.dataset.hero = t.heroLayout;
  root.dataset.density = t.gridDensity;
  window.__tweaks = t;
  window.dispatchEvent(new CustomEvent('tweaks-changed', { detail: t }));
}
applyTweaks(TWEAK_DEFAULTS);

// Edit mode protocol
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === '__activate_edit_mode') {
    document.body.dataset.editMode = 'on';
  } else if (e.data.type === '__deactivate_edit_mode') {
    document.body.dataset.editMode = 'off';
  }
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

function setTweak(key, value) {
  const next = { ...window.__tweaks, [key]: value };
  applyTweaks(next);
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
}
window.setTweak = setTweak;
</script>

<style>
  :root {
    --bg: #F4F1EC;
    --bg-alt: #EBE7E0;
    --ink: #1A1A1A;
    --ink-soft: #4A4A48;
    --ink-faint: #8A857D;
    --line: #1A1A1A;
    --line-faint: rgba(26, 26, 26, 0.12);
    --accent: oklch(0.68 0.17 45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--accent);
    color: var(--bg);
  }

  a { color: inherit; text-decoration: none; }

  /* Smooth scroll */
  html { scroll-behavior: smooth; }

  /* Mono label utility */
  .mono {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 400;
  }

  /* Bracketed meta label */
  .bracket::before { content: "[ "; }
  .bracket::after  { content: " ]"; }

  /* Italic accent */
  .italic-accent {
    font-family: var(--font-italic);
    font-style: italic;
    font-weight: 400;
  }

  /* ── Tweaks panel ── */
  #tweaks-panel {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    width: 280px;
    background: #1A1A1A;
    color: #F4F1EC;
    border: 1px solid rgba(244, 241, 236, 0.1);
    border-radius: 4px;
    padding: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.4);
  }
  body[data-edit-mode="on"] #tweaks-panel { display: block; }

  #tweaks-panel .tw-title {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 10px;
    color: rgba(244, 241, 236, 0.5);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(244, 241, 236, 0.12);
    display: flex;
    justify-content: space-between;
  }
  #tweaks-panel .tw-section {
    margin-bottom: 14px;
  }
  #tweaks-panel .tw-label {
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 9px;
    color: rgba(244, 241, 236, 0.55);
    margin-bottom: 6px;
    display: block;
  }
  #tweaks-panel .tw-options {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  #tweaks-panel button.tw-opt {
    background: transparent;
    color: rgba(244, 241, 236, 0.7);
    border: 1px solid rgba(244, 241, 236, 0.2);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 5px 9px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 120ms;
  }
  #tweaks-panel button.tw-opt:hover {
    border-color: rgba(244, 241, 236, 0.5);
    color: #F4F1EC;
  }
  #tweaks-panel button.tw-opt.active {
    background: #F4F1EC;
    color: #1A1A1A;
    border-color: #F4F1EC;
  }
  #tweaks-panel button.tw-swatch {
    width: 22px; height: 22px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(244, 241, 236, 0.2);
    position: relative;
  }
  #tweaks-panel button.tw-swatch.active {
    border-color: #F4F1EC;
    box-shadow: 0 0 0 2px rgba(244, 241, 236, 0.25);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<!-- Tweaks Panel -->
<div id="tweaks-panel">
  <div class="tw-title">
    <span>Tweaks</span>
    <span style="color: rgba(244,241,236,0.3)">v1</span>
  </div>

  <div class="tw-section">
    <span class="tw-label">Accent</span>
    <div class="tw-options" id="tw-accent"></div>
  </div>

  <div class="tw-section">
    <span class="tw-label">Type pairing</span>
    <div class="tw-options" id="tw-typePair"></div>
  </div>

  <div class="tw-section">
    <span class="tw-label">Hero layout</span>
    <div class="tw-options" id="tw-heroLayout"></div>
  </div>

  <div class="tw-section">
    <span class="tw-label">Grid density</span>
    <div class="tw-options" id="tw-gridDensity"></div>
  </div>
</div>

<script>
function renderTweaksPanel() {
  const accentEl = document.getElementById('tw-accent');
  accentEl.innerHTML = '';
  Object.entries(ACCENTS).forEach(([key, a]) => {
    const b = document.createElement('button');
    b.className = 'tw-opt tw-swatch' + (window.__tweaks.accent === key ? ' active' : '');
    b.style.background = a.value;
    b.title = a.name;
    b.onclick = () => { setTweak('accent', key); renderTweaksPanel(); };
    accentEl.appendChild(b);
  });

  const typeEl = document.getElementById('tw-typePair');
  typeEl.innerHTML = '';
  ['expanded', 'editorial', 'technical', 'classic'].forEach(key => {
    const b = document.createElement('button');
    b.className = 'tw-opt' + (window.__tweaks.typePair === key ? ' active' : '');
    b.textContent = key;
    b.onclick = () => { setTweak('typePair', key); renderTweaksPanel(); };
    typeEl.appendChild(b);
  });

  const heroEl = document.getElementById('tw-heroLayout');
  heroEl.innerHTML = '';
  ['stacked', 'split', 'marquee'].forEach(key => {
    const b = document.createElement('button');
    b.className = 'tw-opt' + (window.__tweaks.heroLayout === key ? ' active' : '');
    b.textContent = key;
    b.onclick = () => { setTweak('heroLayout', key); renderTweaksPanel(); };
    heroEl.appendChild(b);
  });

  const densEl = document.getElementById('tw-gridDensity');
  densEl.innerHTML = '';
  ['compact', 'comfortable', 'spacious'].forEach(key => {
    const b = document.createElement('button');
    b.className = 'tw-opt' + (window.__tweaks.gridDensity === key ? ' active' : '');
    b.textContent = key;
    b.onclick = () => { setTweak('gridDensity', key); renderTweaksPanel(); };
    densEl.appendChild(b);
  });
}
renderTweaksPanel();
</script>

<script type="text/babel" src="portfolio.jsx"></script>
</body>
</html>
