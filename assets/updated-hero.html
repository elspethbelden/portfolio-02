<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NatWest — Case Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Geist + Geist Mono from Google Fonts. Newsreader 200 is a stand-in until PP Editorial New is self-hosted. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,200&display=swap" rel="stylesheet">
  <style>
    /* PP Editorial New is a licensed Pangram Pangram font — drop the woff2 alongside this file to activate it. */
    @font-face {
      font-family: "PP Editorial New";
      src: url("fonts/PPEditorialNew-Ultralight.woff2") format("woff2");
      font-weight: 200;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #160d24;
      --ink: #f4f1ec;
      --ink-muted: rgba(244, 241, 236, 0.75);
      --accent: #8c3fb3;
      --rule: #ffffff;

      --font-display: "PP Editorial New", "Newsreader", Georgia, serif;
      --font-sans: "Geist", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;

      --pad-x: 32px;
      --col-side: 386px;
      --gap: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { -webkit-font-smoothing: antialiased; }

    .hero {
      display: flex;
      flex-direction: column;
      padding: 40px var(--pad-x);
      background: var(--bg);
    }

    /* Top bar */
    .hero__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--gap);
    }
    .hero__brand {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 200;
      font-size: 32px;
      line-height: 40.3px;
      color: var(--ink);
    }
    .hero__nav { width: var(--col-side); flex-shrink: 0; }
    .hero__nav ul { list-style: none; margin: 0; padding: 0; }
    .hero__nav li { border-top: 0.5px solid var(--rule); }
    .hero__nav a {
      display: flex;
      justify-content: flex-end;
      padding: 6px 0;
      font-family: var(--font-sans);
      font-weight: 400;
      font-size: 15.675px;
      line-height: 15.675px;
      letter-spacing: -0.025em;
      color: #fff;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .hero__nav a:hover,
    .hero__nav a:focus-visible { color: var(--accent); }
    .hero__nav a:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

    /* Headline */
    .hero__headline-wrap { padding: 80px 0 40px; }
    .hero__headline {
      margin: 0;
      max-width: 1301px;
      font-family: var(--font-display);
      font-weight: 200;
      font-size: clamp(56px, 9.7vw, 140px);
      line-height: 0.95;           /* 133 / 140 */
      letter-spacing: -0.035em;    /* -4.9 / 140 */
      color: var(--ink);
    }
    .hero__headline em { font-style: normal; color: var(--accent); }

    /* Intro */
    .hero__intro {
      display: grid;
      grid-template-columns: var(--col-side) 1fr;
      gap: var(--gap);
      padding: 40px 0;
    }
    .hero__label {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 17.05px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .hero__body {
      margin: 0;
      padding-right: 80px;
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: 20px;
      line-height: 28px;
      color: var(--ink);
    }

    /* Tablet */
    @media (max-width: 1024px) {
      :root { --col-side: 280px; --gap: 40px; }
      .hero__body { padding-right: 0; }
    }

    /* Mobile */
    @media (max-width: 720px) {
      :root { --pad-x: 16px; --gap: 24px; }
      .hero { padding-top: 24px; padding-bottom: 24px; }
      /* Flatten the top bar so the nav can sit under the H1 */
      .hero__top { display: contents; }
      .hero__brand { order: 1; }
      .hero__headline-wrap { order: 2; padding: 56px 0 24px; }
      .hero__nav { order: 3; width: 100%; }
      .hero__intro { order: 4; }
      .hero__nav a { justify-content: flex-start; }
      .hero__intro { grid-template-columns: 1fr; gap: 12px; padding: 24px 0; }
      .hero__body { font-size: 18px; line-height: 26px; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-labelledby="hero-title">
    <header class="hero__top">
      <p class="hero__brand">NatWest</p>
      <nav class="hero__nav" aria-label="Case study sections">
        <ul>
          <li><a href="#design-systems">Design Systems</a></li>
          <li><a href="#tokenisation">Tokenisation</a></li>
          <li><a href="#governance">Governance</a></li>
        </ul>
      </nav>
    </header>

    <div class="hero__headline-wrap">
      <h1 class="hero__headline" id="hero-title">A design system built to <em>survive a rebrand</em>.</h1>
    </div>

    <div class="hero__intro">
      <p class="hero__label">Intro</p>
      <p class="hero__body">We collapsed four siloed UI kits into one tokenised system for hundreds of designers, and built the governance, documentation and federated contribution model to run it.</p>
    </div>
  </section>
</body>
</html>
