<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "warmth",
  "typePair": "editorial"
}/*EDITMODE-END*/;

const ACCENTS = {
  warmth:    { value: "#FF3414" },
  natwestPurple: { value: "#8C3FB3" },
  rust:      { value: "oklch(0.55 0.17 35)" },
  marigold:  { value: "oklch(0.78 0.14 75)" },
  ink:       { value: "oklch(0.32 0.08 260)" },
  sage:      { value: "oklch(0.62 0.07 140)" }
};

const TYPE_PAIRS = {
  editorial:  { display: "'Cardinal Fruit', Georgia, serif", mono: "'JetBrains Mono', ui-monospace, monospace", body: "'DM Sans', system-ui, sans-serif", italicDisplay: "'Cardinal Fruit', Georgia, serif" },
  technical:  { display: "'JetBrains Mono', ui-monospace, monospace", mono: "'JetBrains Mono', ui-monospace, monospace", body: "'DM Sans', system-ui, sans-serif", italicDisplay: "'Cardinal Fruit', Georgia, serif" },
  classic:    { display: "'Newsreader', Georgia, serif",      mono: "'JetBrains Mono', ui-monospace, monospace", body: "'Newsreader', Georgia, serif",   italicDisplay: "'Cardinal Fruit', Georgia, serif" },
  expanded:   { display: "'Archivo', system-ui, sans-serif",  mono: "'JetBrains Mono', ui-monospace, monospace", body: "'DM Sans', system-ui, sans-serif", italicDisplay: "'Cardinal Fruit', Georgia, serif" }
};

function applyTweaks(t) {
  const root = document.documentElement;
  const accent = ACCENTS[t.accent] || ACCENTS.warmth;
  const type = TYPE_PAIRS[t.typePair] || TYPE_PAIRS.editorial;
  root.style.setProperty('--accent', accent.value);
  root.style.setProperty('--font-display', type.display);
  root.style.setProperty('--font-mono', type.mono);
  root.style.setProperty('--font-body', type.body);
  root.style.setProperty('--font-italic', type.italicDisplay);
}
applyTweaks(TWEAK_DEFAULTS);
</script>
